name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']

jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo prebuild -p android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with: { name: headcount-release-apk, path: app/android/app/build/outputs/apk/release/app-release.apk }

